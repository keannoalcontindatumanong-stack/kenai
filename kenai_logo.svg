<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#131a3a"/>
      <stop offset="100%" stop-color="#1e0f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#3a3aff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a3aff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="340" r="340" fill="url(#glow)"/>

  <!-- faint circuit lines for texture -->
  <g stroke="#2a3568" stroke-width="2" opacity="0.5">
    <path d="M60 620 H240 V560" fill="none"/>
    <path d="M740 200 H600 V260" fill="none"/>
    <path d="M100 150 H180 V210" fill="none"/>
    <path d="M700 640 H600 V700" fill="none"/>
  </g>
  <g fill="#3a4a8a" opacity="0.7">
    <circle cx="240" cy="560" r="5"/>
    <circle cx="600" cy="260" r="5"/>
    <circle cx="180" cy="210" r="5"/>
    <circle cx="600" cy="700" r="5"/>
  </g>

  <!-- Icon: node network forming an upward arrow (automation + success) -->
  <g filter="url(#softGlow)">
    <!-- connecting lines -->
    <g stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
      <line x1="290" y1="330" x2="400" y2="230"/>
      <line x1="400" y1="230" x2="510" y2="330"/>
      <line x1="340" y1="380" x2="400" y2="230"/>
      <line x1="460" y1="380" x2="400" y2="230"/>
    </g>
    <g stroke="url(#accent2)" stroke-width="6" stroke-linecap="round">
      <line x1="290" y1="330" x2="250" y2="410"/>
      <line x1="510" y1="330" x2="550" y2="410"/>
      <line x1="340" y1="380" x2="300" y2="410"/>
      <line x1="460" y1="380" x2="500" y2="410"/>
    </g>

    <!-- nodes -->
    <circle cx="400" cy="230" r="20" fill="#ffffff"/>
    <circle cx="290" cy="330" r="13" fill="url(#accent)"/>
    <circle cx="510" cy="330" r="13" fill="url(#accent)"/>
    <circle cx="340" cy="380" r="10" fill="url(#accent2)"/>
    <circle cx="460" cy="380" r="10" fill="url(#accent2)"/>
    <circle cx="250" cy="410" r="8" fill="#00ffa3"/>
    <circle cx="550" cy="410" r="8" fill="#00ffa3"/>
    <circle cx="300" cy="410" r="8" fill="#00ffa3"/>
    <circle cx="500" cy="410" r="8" fill="#00ffa3"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="86" letter-spacing="2" fill="#ffffff">Ken<tspan fill="url(#accent)">A.I.</tspan></text>

  <!-- Tagline -->
  <text x="400" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="24" letter-spacing="6" fill="#8fa3d9">ALL-IN-ONE AI CONSULTING</text>

  <!-- underline accent -->
  <rect x="300" y="625" width="200" height="4" rx="2" fill="url(#accent)"/>
</svg>
